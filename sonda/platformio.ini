; Probe next to the water heater: M5StickC Plus (ESP32). Sends to the main
; controller (StampS3) over the home WiFi. Separate firmware from the controller.
;   cd sonda && pio run -t upload                      (USB)
;   cd sonda && pio run -e m5stickcplus_ota -t upload  (WiFi, 192.168.86.47)
; ../include holds SondaPacket.h (message format shared with the controller)
; and config.h (WiFi and OTA password, not in git).

[platformio]
default_envs = m5stickcplus
; ../secrets.ini (not in git) holds the OTA password: upload_flags of the ota env
extra_configs = ../secrets*.ini

[env:m5stickcplus]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_flags =
	-I ../include
lib_deps =
	m5stack/M5StickCPlus @ ^0.1.0

; Update over WiFi, to the probe's fixed IP in the router (mDNS: beny-sonda.local)
[env:m5stickcplus_ota]
extends = env:m5stickcplus
upload_protocol = espota
upload_port = 192.168.86.47
