; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; M5Stack Dial V1.1 (StampS3A: ESP32-S3FN8, 8MB flash, sin PSRAM).
; La version para M5StickC Plus esta en la etiqueta git v1-m5stickcplus.

[env:m5dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
; El StampS3 usa el USB nativo del ESP32-S3: sin esto, Serial no sale por USB.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
; Particiones: la placa ya usa default_8MB.csv (2 x 3.3MB de app), sobra espacio.
lib_deps =
	m5stack/M5Dial @ ^1.0.3
	bblanchon/ArduinoJson @ ^6.21.3
	witnessmenow/UniversalTelegramBot @ ^1.3.0
	emelianov/modbus-esp8266 @ ^4.1.0
