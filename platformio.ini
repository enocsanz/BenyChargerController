; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c-plus]
platform = espressif32@6.9.0
board = m5stick-c
board_build.f_cpu = 240000000L
framework = arduino
monitor_speed = 115200
; Single 3MB app partition. The default scheme reserves two 1.25MB app slots so
; OTA can swap between them; without OTA that second slot is dead weight.
; NOTE: changing this requires a USB flash, and it wipes SPIFFS (unused here).
; NVS keeps its offset and size, so the saved mode/limit survive.
board_build.partitions = huge_app.csv
lib_deps = 
	m5stack/M5StickCPlus @ ^0.1.0
	bblanchon/ArduinoJson @ ^6.21.3
	witnessmenow/UniversalTelegramBot @ ^1.3.0
	emelianov/modbus-esp8266 @ ^4.1.0
