; Probe next to the water heater: M5StickC Plus (ESP32), sends to the main
; controller (StampS3) over ESP-NOW. Separate firmware from the controller.
;   cd sonda && pio run -t upload
; ../include holds SondaPacket.h, the message format shared with the controller.

[env:m5stickcplus]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_flags =
	-I ../include
lib_deps =
	m5stack/M5StickCPlus @ ^0.1.0
