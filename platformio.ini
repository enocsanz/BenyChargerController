; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; M5Stack StampS3 (ESP32-S3FN8, 8MB flash, sin PSRAM). Sin pantalla: boton G0
; y LED RGB en G21. Versiones anteriores en las etiquetas git v1-m5stickcplus
; (M5StickC Plus) y v2-m5dial (M5Stack Dial).

[platformio]
default_envs = stamps3
; secrets.ini (not in git) holds the OTA password: upload_flags of stamps3_ota
extra_configs = secrets*.ini

[env:stamps3]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
; 160 MHz en vez de 240: se calienta y consume algo menos (va a ir encapsulado).
; Vigilar la duracion de los envios TLS en /diag y la temperatura del chip.
board_build.f_cpu = 160000000L
; El StampS3 usa el USB nativo del ESP32-S3: sin esto, Serial no sale por USB.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
; Particiones: la placa ya usa default_8MB.csv (2 x 3.3MB de app), sobra espacio.
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.3
	witnessmenow/UniversalTelegramBot @ ^1.3.0
	emelianov/modbus-esp8266 @ ^4.1.0

; Update over WiFi (OTA): pio run -e stamps3_ota -t upload
; The board has a fixed IP in the router. The password comes from secrets.ini
; (upload_flags = --auth=...), the same as OTA_PASSWORD in include/config.h.
; The very first firmware with OTA has to go in by USB (env stamps3).
[env:stamps3_ota]
extends = env:stamps3
upload_protocol = espota
upload_port = 192.168.86.41
